<section class="section-custom bg-light bg-opacity-30 border-top" id="contact">
    <div class="container">
        <div class="row">
            <div class="col-12 text-center">
                <span class="text-muted rounded-3 d-inline-block">📞  Bize Ulaşın</span>
                <h2 class="mt-3 fw-bold mb-5">Sizden Haber Almak <span class="text-primary">İsteriz</span></h2>
            </div>
        </div>

        <div class="row">
            <div class="col-xxl-4">
                <div class="p-4">
                    <div class="d-flex gap-3 mb-4">
                        <div class="avatar-xl flex-shrink-0">
                            <span class="avatar-title bg-primary-subtle text-primary rounded-circle fs-22">
                                <ng-icon name="tablerPhoneCall" />
                            </span>
                        </div>
                        <div>
                            <span class="text-muted">Telefon</span>
                            <h5 class="my-2">+90 (212) 000 00 00</h5>
                            <h5 class="mb-0">+90 (532) 000 00 00</h5>
                        </div>
                    </div>

                    <div class="d-flex gap-3 mb-4">
                        <div class="avatar-xl flex-shrink-0">
                            <span class="avatar-title bg-primary-subtle text-primary rounded-circle fs-22">
                                <ng-icon name="tablerMail" />
                            </span>
                        </div>
                        <div>
                            <span class="text-muted">E-posta</span>
                            <h5 class="my-2">info&#64;wmssupport.com</h5>
                            <h5 class="mb-0">destek&#64;wmssupport.com</h5>
                        </div>
                    </div>

                    <div class="d-flex gap-3">
                        <div class="avatar-xl flex-shrink-0">
                            <span class="avatar-title bg-primary-subtle text-primary rounded-circle fs-22">
                              <ng-icon name="tablerMapPin" />
                            </span>
                        </div>
                        <div>
                            <span class="text-muted">Adres</span>
                            <h5 class="my-1 lh-lg">
                                WMSSupport Teknoloji A.Ş., İstanbul, Türkiye</h5>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-xxl-8">
                <form class="p-4 border rounded-4 border-dashed">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="name" class="form-label">Ad Soyad</label>
                            <input type="text" class="form-control bg-light bg-opacity-50 border-0 py-2" id="name" autocomplete="name" placeholder="Adınızı ve soyadınızı girin">
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">E-posta</label>
                            <input type="email" class="form-control bg-light bg-opacity-50 border-0 py-2" id="email" autocomplete="email" placeholder="E-posta adresinizi girin">
                        </div>

                        <div class="col-md-12">
                            <label for="subject" class="form-label">Konu</label>
                            <input type="text" class="form-control bg-light bg-opacity-50 border-0 py-2" id="subject" placeholder="İletişim nedeniniz nedir?">
                        </div>

                        <div class="col-md-12">
                            <label for="message" class="form-label">Mesaj</label>
                            <textarea class="form-control bg-light bg-opacity-50 border-0 py-2" id="message" rows="5" placeholder="Mesajınızı buraya yazın..."></textarea>
                        </div>

                        <div class="col-md-12 text-end">
                            <button type="submit" class="btn btn-primary rounded-pill">Mesaj Gönder</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
