<header>
    <nav class="navbar navbar-expand-lg py-2 sticky-top {{isSticky ? 'top-scroll-up top-fixed': ''}}"
         id="landing-navbar">
        <div class="container">
            <a routerLink="/home" class="navbar-brand d-flex align-items-center gap-2 text-decoration-none">
                <span class="landing-logo-icon">
                    <i class="fa-solid fa-paper-plane"></i>
                </span>
                <span class="landing-logo-text">Destek <span class="landing-logo-highlight">Alani</span></span>
            </a>

            <button class="navbar-toggler border-0" type="button" (click)="isCollapsed = !isCollapsed"
                    [attr.aria-expanded]="!isCollapsed" aria-controls="navbarSupportedContent"
                    aria-label="Toggle navigation">
                <ng-icon name="tablerMenu2" class="fs-22" style="color: #1e293b;"></ng-icon>
            </button>

            <div [ngbCollapse]="isCollapsed" class="navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav gap-1 mx-auto mt-3 mt-lg-0" id="navbar-example">
                    @for (item of navItems; track $index) {
                        <li class="nav-item">
                            <a class="nav-link text-uppercase"
                               [class.active]="scroll.activeSection === item.id"
                               (click)="scroll.scrollTo(item.id)" href="javascript:void(0)">{{item.label}}</a>
                        </li>
                    }
                </ul>

                <div class="d-flex align-items-center gap-2">
                    <a routerLink="/auth/sign-in" class="btn btn-sm btn-landing-outline">Destek Portalına Giriş</a>
                    <a routerLink="/auth/sign-up" class="btn btn-sm btn-landing">Hesap Oluştur</a>
                </div>
            </div>
        </div>
    </nav>
</header>
